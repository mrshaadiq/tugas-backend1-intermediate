name: calendar-assignment-demo
services:
  backend:
    build:
      context: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-calendar_demo}
      PGUSER: ${POSTGRES_USER:-calendar_demo}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Salin .env.example ke .env dahulu}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calendar_demo}
      POSTGRES_USER: ${POSTGRES_USER:-calendar_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Salin .env.example ke .env dahulu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres_data:
